<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriSales | Multi-Role Registration</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-buyer" id="bodyElement">
  <div class="auth-container">
    <main class="auth-card wide">
      <header class="auth-header">
        <span class="brand-badge" id="roleBadge">🌾 Create AgriSales Account</span>
        <h1>Register New User</h1>
        <p>Select your account role below to complete registration</p>
      </header>

      <form id="agriSalesSignupForm" novalidate>
        <div class="form-grid two-col">
          <!-- Role Selection Dropdown -->
          <div class="form-group" style="grid-column: span 2;">
            <label for="userRole">Account Role Type</label>
            <select id="userRole" class="form-control" required>
              <option value="buyer">🛒 Buyer (Retailer / Wholesale Purchaser)</option>
              <option value="seller">🚜 Seller / Farmer (Agricultural Producer)</option>
              <option value="merchant">🧪 Agri-Merchant (Pesticide, Fertilizer & Seed Vendor)</option>
              <option value="admin">🛡️ Admin (System Administrator)</option>
            </select>
            <span class="error-feedback"></span>
          </div>

          <!-- Common Shared Fields -->
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" class="form-control" placeholder="Alex Johnson" required>
            <span class="error-feedback"></span>
          </div>

          <div class="form-group">
            <label for="userEmail">Email Address</label>
            <input type="email" id="userEmail" class="form-control" placeholder="alex@freshmarket.com" required>
            <span class="error-feedback"></span>
          </div>

          <div class="form-group" id="phoneGroup">
            <label for="userPhone">Phone Number</label>
            <input type="tel" id="userPhone" class="form-control" placeholder="+91 98765-43210" required>
            <span class="error-feedback"></span>
          </div>

          <!-- ROLE SPECIFIC DYNAMIC FIELDS -->
          
          <!-- Buyer Specific Fields -->
          <div id="buyerFieldsSection" class="role-fields-container">
            <div class="form-group">
              <label for="buyerCategory">Buyer Category</label>
              <select id="buyerCategory" class="form-control">
                <option value="">Select Category</option>
                <option value="retailer">Grocery Store / Retailer</option>
                <option value="restaurant">Restaurant / Culinary</option>
                <option value="wholesaler">Bulk Wholesaler</option>
                <option value="individual">Individual Household</option>
              </select>
              <span class="error-feedback"></span>
            </div>

            <div class="form-group" style="grid-column: span 2;">
              <label for="buyerAddress">Delivery Address</label>
              <input type="text" id="buyerAddress" class="form-control" placeholder="Plot 42, APMC Market, Vashi, Navi Mumbai">
              <span class="error-feedback"></span>
            </div>
          </div>

          <!-- Farmer / Seller Specific Fields -->
          <div id="sellerFieldsSection" class="role-fields-container" style="display: none;">
            <div class="form-group">
              <label for="farmName">Farm / Business Name</label>
              <input type="text" id="farmName" class="form-control" placeholder="Green Acres Organic Farm">
              <span class="error-feedback"></span>
            </div>

            <div class="form-group">
              <label for="farmRegion">Farm Location / Region</label>
              <input type="text" id="farmRegion" class="form-control" placeholder="Nashik, Maharashtra">
              <span class="error-feedback"></span>
            </div>

            <div class="form-group">
              <label for="cropCategory">Primary Produce</label>
              <select id="cropCategory" class="form-control">
                <option value="">Select Produce Type</option>
                <option value="fruits-veg">Fresh Fruits & Vegetables</option>
                <option value="grains">Grains & Pulses</option>
                <option value="rice">Rice Crops</option>
              </select>
              <span class="error-feedback"></span>
            </div>

            <div class="form-group">
              <label for="licenseId">Agricultural License ID</label>
              <input type="text" id="licenseId" class="form-control" placeholder="FARM-MH-98741">
              <span class="error-feedback"></span>
            </div>
          </div>

          <!-- Agri-Merchant Specific Fields -->
          <div id="merchantFieldsSection" class="role-fields-container" style="display: none;">
            <div class="form-group">
              <label for="storeName">Agri Store / Company Name</label>
              <input type="text" id="storeName" class="form-control" placeholder="Kisan Agri Supplies & Fertilizers">
              <span class="error-feedback"></span>
            </div>

            <div class="form-group">
              <label for="merchantLicense">Pesticide / Fertilizer License ID</label>
              <input type="text" id="merchantLicense" class="form-control" placeholder="PEST-REG-5542">
              <span class="error-feedback"></span>
            </div>

            <div class="form-group" style="grid-column: span 2;">
              <label for="supplyCategory">Primary Supplies Offered</label>
              <select id="supplyCategory" class="form-control">
                <option value="">Select Supplies Category</option>
                <option value="pesticides-fertilizers">Pesticides & Organic Manure</option>
                <option value="seeds-medicines">Hybrid Seeds & Crop Medicines</option>
                <option value="all-supplies">Complete Farming Inputs & Tools</option>
              </select>
              <span class="error-feedback"></span>
            </div>
          </div>

          <!-- Admin Specific Fields -->
          <div id="adminFieldsSection" class="role-fields-container" style="display: none;">
            <div class="form-group">
              <label for="adminDepartment">Admin Department</label>
              <select id="adminDepartment" class="form-control">
                <option value="">Select Department</option>
                <option value="Security & Compliance">Security & Compliance</option>
                <option value="Market Operations">Market Operations</option>
                <option value="System Engineering">System Engineering</option>
              </select>
              <span class="error-feedback"></span>
            </div>

            <div class="form-group">
              <label for="adminKey">Master Access Key</label>
              <input type="text" id="adminKey" class="form-control" placeholder="ADMIN-2026-KEY">
              <span class="error-feedback"></span>
            </div>
          </div>

          <!-- Passwords -->
          <div class="form-group">
            <label for="userPassword">Password</label>
            <div class="input-wrapper">
              <input type="password" id="userPassword" class="form-control" placeholder="Min 8 chars, 1 uppercase, 1 special" required>
              <button type="button" class="toggle-password">Show</button>
            </div>
            <span class="error-feedback"></span>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="input-wrapper">
              <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required>
              <button type="button" class="toggle-password">Show</button>
            </div>
            <span class="error-feedback"></span>
          </div>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 1.5rem;" id="btnSignupSubmit">Create AgriSales Account →</button>
      </form>

      <footer class="auth-footer">
        Already have an account? <a href="index.html">Sign In Here</a>
      </footer>
    </main>
  </div>

  <script src="js/auth-shared.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>

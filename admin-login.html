<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | AgriTrade System</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-admin">
  <div class="auth-container">
    <main class="auth-card">
      <header class="auth-header">
        <span class="role-badge">🛡️ Administrator Access</span>
        <h1>Admin Portal Login</h1>
        <p>Sign in to manage system security, users & marketplace</p>
      </header>

      <!-- Demo Credentials Banner -->
      <section class="demo-banner">
        <div class="demo-banner-header">
          <span>Key Test Credentials</span>
          <button type="button" class="btn-autofill" id="btnAutofillAdmin">Auto-fill Demo</button>
        </div>
        <div class="demo-banner-body">
          Email: <code>admin@agritrade.com</code> | Pass: <code>Admin@1234</code>
        </div>
      </section>

      <form id="adminLoginForm" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="adminEmail">Admin Email</label>
            <input type="email" id="adminEmail" class="form-control" placeholder="admin@agritrade.com" required>
            <span class="error-feedback"></span>
          </div>

          <div class="form-group">
            <label for="adminPassword">Password</label>
            <div class="input-wrapper">
              <input type="password" id="adminPassword" class="form-control" placeholder="••••••••" required>
              <button type="button" class="toggle-password">Show</button>
            </div>
            <span class="error-feedback"></span>
          </div>

          <button type="submit" class="btn-primary" id="btnAdminLogin">Sign In as Admin →</button>
        </div>
      </form>

      <footer class="auth-footer">
        Need admin credentials? <a href="admin-signup.html">Register New Admin</a>
        <br><br>
        <a href="index.html" style="color: var(--text-muted); font-size: 0.8rem;">← Back to Role Selection</a>
      </footer>
    </main>
  </div>

  <script src="js/auth-shared.js"></script>
  <script src="js/admin-login.js"></script>
</body>
</html>

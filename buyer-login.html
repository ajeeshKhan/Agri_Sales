<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buyer Login | Fresh Produce Marketplace</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-buyer">
  <div class="auth-container">
    <main class="auth-card">
      <header class="auth-header">
        <span class="role-badge">🛒 Buyer Portal</span>
        <h1>Buyer Sign In</h1>
        <p>Browse fresh farm-direct produce & manage orders</p>
      </header>

      <!-- Demo Credentials Banner -->
      <section class="demo-banner">
        <div class="demo-banner-header">
          <span>Buyer Demo Account</span>
          <button type="button" class="btn-autofill" id="btnAutofillBuyer">Auto-fill Demo</button>
        </div>
        <div class="demo-banner-body">
          Email: <code>buyer@freshmarket.com</code> | Pass: <code>Buyer@1234</code>
        </div>
      </section>

      <form id="buyerLoginForm" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="buyerEmail">Email Address</label>
            <input type="email" id="buyerEmail" class="form-control" placeholder="buyer@freshmarket.com" required>
            <span class="error-feedback"></span>
          </div>

          <div class="form-group">
            <label for="buyerPassword">Password</label>
            <div class="input-wrapper">
              <input type="password" id="buyerPassword" class="form-control" placeholder="••••••••" required>
              <button type="button" class="toggle-password">Show</button>
            </div>
            <span class="error-feedback"></span>
          </div>

          <button type="submit" class="btn-primary" id="btnBuyerLogin">Login to Marketplace →</button>
        </div>
      </form>

      <footer class="auth-footer">
        New buyer? <a href="buyer-signup.html">Create Buyer Account</a>
        <br><br>
        <a href="index.html" style="color: var(--text-muted); font-size: 0.8rem;">← Back to Role Selection</a>
      </footer>
    </main>
  </div>

  <script src="js/auth-shared.js"></script>
  <script src="js/buyer-login.js"></script>
</body>
</html>
